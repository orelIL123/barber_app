<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ron Turgeman - תמיכה ומדיניות פרטיות</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            direction: rtl;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        a {
            display: block;
            padding: 20px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .lang-switch {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }
        .lang-switch a {
            background: #f5f5f5;
            color: #667eea;
            font-size: 0.9em;
            padding: 10px 20px;
        }
        .lang-switch a:hover {
            background: #e8e8e8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ron Turgeman</h1>
        <p class="subtitle">ברוכים הבאים לעמוד התמיכה והמדיניות</p>
        
        <div class="links">
            <a href="/privacy-policy.html">מדיניות פרטיות</a>
            <a href="/support.html">תמיכה ויצירת קשר</a>
        </div>
        
        <div class="lang-switch">
            <a href="/index-en.html">English / עברית</a>
        </div>
    </div>
</body>
</html>
